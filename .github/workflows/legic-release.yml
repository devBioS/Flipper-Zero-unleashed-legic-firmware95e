name: Build and release Unleashed 095e LEGIC

on:
  push:
    branches: [legic-prime-095e]
    tags: ['unlshd-095e-legic-*']
  pull_request:
    branches: [legic-prime-095e]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legic-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate complete 095e package
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FBT_NO_SYNC: '1'
    steps:
      - name: Check out firmware and pinned submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Build firmware, app packs and SDK; validate release
        run: python3 scripts/legic_prime/build_release.py

      - name: Add flash report to workflow summary
        if: always()
        shell: bash
        run: |
          if [[ -f release-artifacts/flash-report.md ]]; then
            cat release-artifacts/flash-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload validated release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unleashed-095e-legic-${{ github.sha }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'devBioS/Flipper-Zero-unleashed-legic-firmware95e'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unleashed-095e-legic-${{ github.sha }}
          path: release-artifacts

      - name: Verify transferred artifact checksums
        working-directory: release-artifacts
        run: sha256sum --check SHA256SUMS

      - name: Create release from the built commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          short_sha="${SOURCE_SHA:0:12}"
          release_tag="unlshd-095e-legic-${short_sha}"
          release_flags=(--prerelease --latest=false)
          if [[ "$REF_TYPE" == tag ]]; then
            release_tag="$REF_NAME"
            release_flags=(--verify-tag --latest)
          fi
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $release_tag already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create "$release_tag" release-artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$SOURCE_SHA" \
            --title "Unleashed 095e + LEGIC Prime (${short_sha})" \
            --notes-file release-artifacts/RELEASE_NOTES.md \
            "${release_flags[@]}"
